<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O/X 상식퀴즈 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* 플레이어 선택 화면 */
        .selection-screen {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .selection-screen h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .color-option {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 3px solid #ddd;
            cursor: pointer;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .color-option:hover {
            transform: scale(1.1);
            border-color: #333;
        }

        .color-option.selected {
            border-color: #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .start-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .start-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .start-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .player-name-input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        /* 게임 화면 */
        .game-screen {
            display: none;
        }

        .quiz-area {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .quiz-number {
            color: #667eea;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .quiz-question {
            font-size: 1.5em;
            color: #333;
            margin: 15px 0;
            font-weight: bold;
        }

        .quiz-timer {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1.1em;
            margin-top: 10px;
        }

        .game-board-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .answer-area {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .answer-area.o-area {
            border: 4px solid #51cf66;
        }

        .answer-area.x-area {
            border: 4px solid #ff6b6b;
        }

        .answer-label {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 1.5em;
            font-weight: bold;
        }

        .answer-area.o-area .answer-label {
            color: #51cf66;
        }

        .answer-area.x-area .answer-label {
            color: #ff6b6b;
        }

        .player {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            border: 2px solid rgba(0, 0, 0, 0.2);
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            cursor: move;
            user-select: none;
        }

        .player-info {
            position: absolute;
            top: 5px;
            left: 5px;
            font-size: 0.7em;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 5px;
            border-radius: 3px;
            color: white;
        }

        .players-status {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .players-status h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .player-status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .status-color {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-info {
            flex: 1;
        }

        .status-name {
            font-weight: bold;
            color: #333;
        }

        .status-lives {
            color: #666;
            font-size: 0.9em;
        }

        .status-lives .heart {
            color: #ff6b6b;
        }

        .status-eliminated {
            background: #f0f0f0;
            opacity: 0.6;
        }

        .status-eliminated .status-name {
            text-decoration: line-through;
            color: #999;
        }

        .game-over-screen {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .game-over-screen h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .winner {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5em;
            margin: 20px 0;
        }

        .restart-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .restart-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .controls-info {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .selection-screen {
                padding: 20px;
            }

            .selection-screen h1 {
                font-size: 1.5em;
            }

            .quiz-question {
                font-size: 1.2em;
            }

            .game-board-container {
                grid-template-columns: 1fr;
            }

            .answer-area {
                min-height: 200px;
            }

            .player {
                width: 35px;
                height: 35px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 플레이어 선택 화면 -->
        <div class="selection-screen" id="selectionScreen">
            <h1>🎮 O/X 상식퀴즈 게임</h1>
            
            <div id="playersInput"></div>
            
            <button class="start-button" id="startButton" disabled>게임 시작</button>
        </div>

        <!-- 게임 화면 -->
        <div class="game-screen" id="gameScreen">
            <div class="quiz-area">
                <div class="quiz-number" id="quizNumber">문제 1/10</div>
                <div class="quiz-question" id="quizQuestion">문제가 로드 중입니다...</div>
                <div class="quiz-timer" id="quizTimer">15초</div>
            </div>

            <div class="players-status" id="playersStatus"></div>

            <div class="game-board-container">
                <div class="answer-area o-area" id="oArea">
                    <div class="answer-label">O(참)</div>
                </div>
                <div class="answer-area x-area" id="xArea">
                    <div class="answer-label">X(거짓)</div>
                </div>
            </div>

            <div class="controls-info">
                🖱️ 마우스/터치로 이동하거나<br>
                ⌨️ 화살표 키 또는 WASD로 조종하세요
            </div>
        </div>

        <!-- 게임 오버 화면 -->
        <div class="game-over-screen" id="gameOverScreen">
            <h2>게임 종료!</h2>
            <div id="gameOverContent"></div>
            <button class="restart-button" id="restartButton">처음부터 시작</button>
        </div>
    </div>

    <script>
        // 게임 설정
        const COLORS = [
            { name: '빨강', hex: '#ff6b6b', emoji: '🔴' },
            { name: '파랑', hex: '#4c6ef5', emoji: '🔵' },
            { name: '초록', hex: '#51cf66', emoji: '💚' },
            { name: '노랑', hex: '#ffd93d', emoji: '💛' },
            { name: '보라', hex: '#c084fc', emoji: '🟣' },
            { name: '주황', hex: '#ff922b', emoji: '🟠' },
            { name: '핑크', hex: '#ff6b9d', emoji: '💗' },
            { name: '민트', hex: '#06d6a0', emoji: '💚' }
        ];

        const QUIZZES = [
            { q: '서울은 한국의 수도이다.', a: true },
            { q: '지구는 태양 주위를 돈다.', a: true },
            { q: '고양이는 초식동물이다.', a: false },
            { q: '1+1은 2이다.', a: true },
            { q: '펭귄은 날 수 있는 새이다.', a: false },
            { q: '물은 화학식으로 H2O이다.', a: true },
            { q: '금은 은보다 무겁다.', a: true },
            { q: '뱀은 다리가 있다.', a: false },
            { q: '달은 지구의 위성이다.', a: true },
            { q: '염소는 노란색이다.', a: false }
        ];

        // 게임 상태
        let gameState = {
            players: [],
            currentQuizIndex: 0,
            gameActive: true,
            selectedColors: new Set()
        };

        // 초기화
        function init() {
            renderColorSelection();
            document.getElementById('startButton').addEventListener('click', startGame);
            document.getElementById('restartButton').addEventListener('click', () => location.reload());
        }

        // 플레이어 수 선택
        function renderColorSelection() {
            const container = document.getElementById('playersInput');
            container.innerHTML = '<p style="margin-bottom: 15px; color: #666;">플레이어 수를 선택하세요 (2-4명):</p>';
            
            for (let i = 2; i <= 4; i++) {
                const btn = document.createElement('button');
                btn.textContent = `${i}명`;
                btn.className = 'start-button';
                btn.style.margin = '5px';
                btn.onclick = () => selectPlayers(i);
                container.appendChild(btn);
            }
        }

        function selectPlayers(count) {
            gameState.players = [];
            gameState.selectedColors.clear();
            
            const container = document.getElementById('playersInput');
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const playerDiv = document.createElement('div');
                playerDiv.style.margin = '15px 0';

                const label = document.createElement('label');
                label.textContent = `플레이어 ${i + 1}`;
                label.style.display = 'block';
                label.style.marginBottom = '8px';
                label.style.color = '#333';
                label.style.fontWeight = 'bold';

                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = `플레이어 ${i + 1} 이름`;
                input.className = 'player-name-input';
                input.id = `playerName${i}`;

                playerDiv.appendChild(label);
                playerDiv.appendChild(input);
                container.appendChild(playerDiv);
            }

            // 색상 선택
            const colorLabel = document.createElement('p');
            colorLabel.textContent = '각 플레이어의 색상을 선택하세요:';
            colorLabel.style.marginTop = '20px';
            colorLabel.style.fontWeight = 'bold';
            colorLabel.style.color = '#333';
            container.appendChild(colorLabel);

            const colorGrid = document.createElement('div');
            colorGrid.className = 'color-grid';
            colorGrid.style.marginTop = '15px';

            COLORS.forEach((color, idx) => {
                const colorBtn = document.createElement('div');
                colorBtn.className = 'color-option';
                colorBtn.style.backgroundColor = color.hex;
                colorBtn.textContent = color.emoji;
                colorBtn.dataset.colorIdx = idx;
                colorBtn.onclick = () => toggleColor(colorBtn, idx, count);
                colorGrid.appendChild(colorBtn);
            });

            container.appendChild(colorGrid);

            document.getElementById('startButton').disabled = false;
        }

        let selectedColorIndices = [];

        function toggleColor(btn, idx, playerCount) {
            const index = selectedColorIndices.indexOf(idx);
            
            if (index >= 0) {
                selectedColorIndices.splice(index, 1);
                btn.classList.remove('selected');
            } else if (selectedColorIndices.length < playerCount) {
                selectedColorIndices.push(idx);
                btn.classList.add('selected');
            } else {
                alert(`${playerCount}명의 플레이어만 선택 가능합니다!`);
            }

            checkStartButton(playerCount);
        }

        function checkStartButton(playerCount) {
            const allNames = [];
            for (let i = 0; i < playerCount; i++) {
                const name = document.getElementById(`playerName${i}`).value.trim();
                allNames.push(name);
            }

            const allNamed = allNames.every(n => n.length > 0);
            const allColorsSelected = selectedColorIndices.length === playerCount;

            document.getElementById('startButton').disabled = !(allNamed && allColorsSelected);
        }

        function startGame() {
            const playerCount = document.querySelectorAll('[id^="playerName"]').length;
            
            gameState.players = [];
            for (let i = 0; i < playerCount; i++) {
                const name = document.getElementById(`playerName${i}`).value.trim();
                const colorIdx = selectedColorIndices[i];
                const color = COLORS[colorIdx];

                gameState.players.push({
                    id: i,
                    name: name,
                    color: color,
                    x: Math.random() * 200 + 50,
                    y: Math.random() * 100 + 50,
                    lives: 2,
                    eliminated: false,
                    inO: true
                });
            }

            gameState.currentQuizIndex = 0;
            gameState.gameActive = true;

            document.getElementById('selectionScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';

            setupGame();
            nextQuiz();
        }

        function setupGame() {
            const oArea = document.getElementById('oArea');
            const xArea = document.getElementById('xArea');

            gameState.players.forEach(player => {
                const playerEl = document.createElement('div');
                playerEl.className = 'player';
                playerEl.id = `player${player.id}`;
                playerEl.style.backgroundColor = player.color.hex;
                playerEl.textContent = player.name.charAt(0).toUpperCase();
                playerEl.dataset.playerId = player.id;

                if (Math.random() > 0.5) {
                    xArea.appendChild(playerEl);
                    player.inO = false;
                } else {
                    oArea.appendChild(playerEl);
                    player.inO = true;
                }

                updatePlayerPosition(player, playerEl);
                setupPlayerControls(player, playerEl);
            });

            updatePlayersStatus();
        }

        function updatePlayerPosition(player, element) {
            const area = document.getElementById(player.inO ? 'oArea' : 'xArea');
            const rect = area.getBoundingClientRect();
            const containerRect = document.querySelector('.container').getBoundingClientRect();

            let x = player.x;
            let y = player.y;

            if (x + 40 > rect.width) x = rect.width - 40;
            if (y + 40 > rect.height) y = rect.height - 40;
            if (x < 0) x = 0;
            if (y < 0) y = 0;

            player.x = x;
            player.y = y;

            element.style.left = x + 'px';
            element.style.top = y + 'px';
        }

        function setupPlayerControls(player, element) {
            let keys = {};

            document.addEventListener('keydown', (e) => {
                if (!gameState.gameActive || player.eliminated) return;
                
                keys[e.key.toLowerCase()] = true;
                handleMovement(player, element, keys);
            });

            document.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });

            element.addEventListener('touchstart', (e) => {
                if (!gameState.gameActive || player.eliminated) return;
                
                const touch = e.touches[0];
                const rect = element.getBoundingClientRect();
                element.dataset.startX = touch.clientX;
                element.dataset.startY = touch.clientY;
            });

            element.addEventListener('touchmove', (e) => {
                if (!gameState.gameActive || player.eliminated) return;
                
                const touch = e.touches[0];
                const startX = parseFloat(element.dataset.startX) || touch.clientX;
                const startY = parseFloat(element.dataset.startY) || touch.clientY;

                const diffX = touch.clientX - startX;
                const diffY = touch.clientY - startY;

                if (Math.abs(diffX) > 5) {
                    player.x += diffX > 0 ? 5 : -5;
                }
                if (Math.abs(diffY) > 5) {
                    player.y += diffY > 0 ? 5 : -5;
                }

                updatePlayerPosition(player, element);
                element.dataset.startX = touch.clientX;
                element.dataset.startY = touch.clientY;
            });
        }

        function handleMovement(player, element, keys) {
            const speed = 5;
            let moved = false;

            if (keys['arrowup'] || keys['w']) {
                player.y = Math.max(0, player.y - speed);
                moved = true;
            }
            if (keys['arrowdown'] || keys['s']) {
                player.y += speed;
                moved = true;
            }
            if (keys['arrowleft'] || keys['a']) {
                player.x = Math.max(0, player.x - speed);
                moved = true;
            }
            if (keys['arrowright'] || keys['d']) {
                player.x += speed;
                moved = true;
            }

            if (moved) {
                updatePlayerPosition(player, element);
            }
        }

        function nextQuiz() {
            if (gameState.currentQuizIndex >= QUIZZES.length) {
                endGame();
                return;
            }

            const quiz = QUIZZES[gameState.currentQuizIndex];
            document.getElementById('quizNumber').textContent = `문제 ${gameState.currentQuizIndex + 1}/10`;
            document.getElementById('quizQuestion').textContent = quiz.q;

            let timeLeft = 15;
            document.getElementById('quizTimer').textContent = timeLeft + '초';

            const timer = setInterval(() => {
                timeLeft--;
                document.getElementById('quizTimer').textContent = timeLeft + '초';

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    checkAnswers(quiz.a);
                }
            }, 1000);
        }

        function checkAnswers(correctAnswer) {
            const oArea = document.getElementById('oArea');
            const xArea = document.getElementById('xArea');

            gameState.players.forEach(player => {
                if (player.eliminated) return;

                const isInOArea = oArea.contains(document.getElementById(`player${player.id}`));
                const playerAnswer = isInOArea;
                const isCorrect = playerAnswer === correctAnswer;

                if (!isCorrect) {
                    player.lives--;
                    if (player.lives <= 0) {
                        player.eliminated = true;
                        document.getElementById(`player${player.id}`).style.opacity = '0.3';
                    }
                }
            });

            updatePlayersStatus();

            const activePlayers = gameState.players.filter(p => !p.eliminated);
            if (activePlayers.length <= 1) {
                endGame();
            } else {
                gameState.currentQuizIndex++;
                setTimeout(nextQuiz, 2000);
            }
        }

        function updatePlayersStatus() {
            const statusHTML = gameState.players.map(player => {
                const hearts = '❤️'.repeat(player.lives);
                const statusClass = player.eliminated ? 'status-eliminated' : '';
                
                return `
                    <div class="player-status-item ${statusClass}">
                        <div class="status-color" style="background: ${player.color.hex}"></div>
                        <div class="status-info">
                            <div class="status-name">${player.name}</div>
                            <div class="status-lives">${player.eliminated ? '탈락' : hearts}</div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('playersStatus').innerHTML = statusHTML;
        }

        function endGame() {
            gameState.gameActive = false;
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'block';

            const survivors = gameState.players.filter(p => !p.eliminated);

            let content = '';
            if (survivors.length === 1) {
                const winner = survivors[0];
                content = `<div class="winner">🏆 ${winner.name} 우승! 🏆</div>`;
            } else if (survivors.length === 0) {
                content = `<div class="winner">🎲 모두 탈락! 다시 도전하세요! 🎲</div>`;
            } else {
                content = `<div class="winner">🏆 ${survivors.map(p => p.name).join(', ')} 우승! 🏆</div>`;
            }

            document.getElementById('gameOverContent').innerHTML = content;
        }

        // 게임 시작
        init();
    </script>
</body>
</html>
