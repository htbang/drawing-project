<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>O/X 상식퀴즈</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;}
    .card{width:100%;max-width:760px;background:#fff;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:20px;}
    h1{text-align:center;color:#222;margin-bottom:8px;font-size:2rem;}
    .subtitle{text-align:center;color:#666;margin-bottom:18px;}
    input, button{font-size:1rem;padding:12px;border-radius:8px;border:1px solid #ccc;}
    input{width:100%;margin-bottom:12px;}
    button{width:100%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;cursor:pointer;}
    button:disabled{opacity:.5;cursor:not-allowed;}
    .list{background:#f7f7f7;padding:10px;border-radius:10px;max-height:180px;overflow:auto;margin-top:12px;}
    .item{margin:6px 0;padding:8px;background:#fff;border-radius:8px;border:1px solid #ddd;display:flex;justify-content:space-between;}
    .game-screen{display:none;}
    .active{display:block;}
    .controls{display:flex;gap:8px;margin-top:12px;}
    .controls button{flex:1;background:#ff6b6b;}
    .controls button.ok{background:#51cf66;}
    .pause{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:1000;visibility:hidden;opacity:0;transition:all .2s;}
    .pause.show{visibility:visible;opacity:1;}
    .pausebox{background:#fff;padding:30px;border-radius:12px;text-align:center;}
  </style>
</head>
<body>
  <div class="card" id="lobby">
    <h1>O/X 상식퀴즈 게임</h1>
    <p class="subtitle">이름 입력 후 입장, 모두 준비 시 시작</p>
    <input id="name" placeholder="이름" maxlength="12" />
    <button id="enterBtn">입장하기</button>
    <div class="list" id="players"></div>
    <button id="readyBtn" disabled>준비 완료</button>
  </div>

  <div class="card game-screen" id="game">
    <h1>퀴즈 진행중</h1>
    <div id="qIdx">문제 1/1</div>
    <div id="qText" style="margin:10px 0;font-size:1.35rem;color:#333;">준비 중...</div>
    <div id="timer" style="margin-bottom:12px;font-weight:bold;">15초</div>
    <div class="controls">
      <button class="ok" id="oBtn">O</button>
      <button id="xBtn">X</button>
    </div>
    <div style="margin-top:12px;background:#f7f7f7;padding:10px;border-radius:8px;" id="status"></div>
    <div class="controls" style="margin-top:8px;">
      <button id="pauseBtn" style="background:#ffa500;">일시정지</button>
      <button id="stopBtn" style="background:#ff6b6b;">중단</button>
    </div>
  </div>

  <div class="pause" id="pauseModal"><div class="pausebox"><h2>일시정지됨</h2><button id="resumeBtn" style="background:#51cf66;width:100%;">재개</button></div></div>

  <div class="card" id="end" style="display:none;"><h1>게임 종료</h1><div id="result"></div><button id="restartBtn" style="margin-top:12px;">다시하기</button></div>

  <script>
    const KEY_P = 'quiz_players';
    const KEY_S = 'quiz_state';
    const QUESTIONS = [
      {q:'지구는 둥글다.', a:true},
      {q:'고양이는 초식동물이다.', a:false},
      {q:'물은 H2O이다.', a:true},
      {q:'1+1=3이다.', a:false},
      {q:'태양은 지구보다 작다.', a:false}
    ];

    let state = {players:[],active:false,paused:false,cur:0,sec:15};
    let timer=null;

    const $=id=>document.getElementById(id);
    const render = ()=>{
      const p = state.players;
      $('players').innerHTML = p.length ? p.map(x=>`<div class="item"><span>${x.name}</span><span>${x.ready?'준비':'대기'}</span></div>`).join('') : '<div style="text-align:center;color:#999;">플레이어 없음</div>';
      $('readyBtn').disabled = !p.some(x=>x.name===sessionStorage.getItem('me'));
      $('readyBtn').textContent = p.find(x=>x.name===sessionStorage.getItem('me'))?.ready ? '준비취소':'준비완료';
      if(state.active){$('lobby').style.display='none';$('game').classList.add('active');$('end').style.display='none';}
      else if(state.cur>=QUESTIONS.length || p.filter(x=>!x.elim).length<=1){$('lobby').style.display='none';$('game').classList.remove('active');$('end').style.display='block';$('result').textContent = p.filter(x=>!x.elim)[0]?.name ? `${p.filter(x=>!x.elim)[0].name} 승리!`:'모두 탈락';}
      else{$('lobby').style.display='block';$('game').classList.remove('active');$('end').style.display='none';}
      saveState();
    };

    const saveState = ()=>{localStorage.setItem(KEY_P,JSON.stringify(state.players)); localStorage.setItem(KEY_S,JSON.stringify({active:state.active,cur:state.cur,sec:state.sec,paused:state.paused}));};
    const loadState = ()=>{try{const a=JSON.parse(localStorage.getItem(KEY_P)); if(a)state.players=a;}catch{} try{const b=JSON.parse(localStorage.getItem(KEY_S)); if(b){state.active=b.active;state.cur=b.cur;state.sec=b.sec;state.paused=b.paused;}}catch{} };

    const startTimer = ()=>{clearInterval(timer); timer=setInterval(()=>{if(state.paused)return;state.sec--; $('timer').textContent=state.sec+'초'; if(state.sec<=0){clearInterval(timer); answer(null);} },1000);};
    const showQuestion = ()=>{if(state.cur>=QUESTIONS.length){state.active=false;render();return;} $('qIdx').textContent=`문제 ${state.cur+1}/${QUESTIONS.length}`; $('qText').textContent=QUESTIONS[state.cur].q; $('timer').textContent=state.sec+'초'; startTimer(); };

    const answer = (v)=>{if(!state.active)return;const right=QUESTIONS[state.cur].a; state.players.forEach(p=>{if(p.elim)return; if(v===null || v!==right){p.lives--; if(p.lives<=0){p.elim=true;}}}); state.cur++; state.sec=15; if(state.cur>=QUESTIONS.length||state.players.filter(p=>!p.elim).length<=1){state.active=false;clearInterval(timer);render();return;} state.paused=false; $('pauseModal').classList.remove('show'); showQuestion();};

    $('enterBtn').onclick=()=>{const n=$('name').value.trim(); if(!n){alert('이름입력');return;} if(state.players.some(p=>p.name===n)){alert('중복');return;} state.players.push({name:n,ready:false,lives:2,elim:false}); sessionStorage.setItem('me',n); $('name').value=''; render();};
    $('readyBtn').onclick=()=>{const me=sessionStorage.getItem('me');const p=state.players.find(item=>item.name===me); if(!p)return; p.ready=!p.ready; if(state.players.every(x=>x.ready)) {state.active=true; state.cur=0; state.sec=15; state.players.forEach(p=>{p.elim=false; p.lives=2;}); showQuestion();} render();};
    $('pauseBtn').onclick=()=>{if(!state.active||state.paused)return;state.paused=true; $('pauseModal').classList.add('show');};
    $('resumeBtn').onclick=()=>{if(!state.active||!state.paused)return;state.paused=false;$('pauseModal').classList.remove('show');};
    $('stopBtn').onclick=()=>{state.active=false;clearInterval(timer);render();};
    $('oBtn').onclick=()=>answer(true);
    $('xBtn').onclick=()=>answer(false);
    $('restartBtn').onclick=()=>{state.active=false;state.cur=0;state.sec=15;state.players.forEach(p=>{p.ready=false;p.elim=false;p.lives=2;});render();};

    window.addEventListener('storage',()=>{loadState();render();});
    loadState(); render();
  </script>
</body>
</html>
